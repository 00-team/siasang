[workspace]
members = ["kaf", "koh", "owj"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
log = "0.4"
potk = "1.2"
kaf = { path = "./kaf" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
actix-web = "4"
utoipa = { version = "5.3.1", features = ["actix_extras", "debug"] }
rand = "0.10"
toml = "0.9.10"
faster-hex = "1"

[workspace.dependencies.reqwest]
version = "0.13"
default-features = false
features = ["rustls", "charset", "http2", "json", "gzip"]

[workspace.lints.clippy]
needless_return_with_question_mark = "allow"
